{% extends "base.html" %}
{% block title %}Error {{ status }} - Sistema Integral de Gestión Documental{% endblock %}
{% block content %}
  <section class="error-state">
    <span>{{ status }}</span>
    <p class="header-eyebrow">NO SE COMPLETÓ LA SOLICITUD</p>
    <h1>{{ message }}</h1>
    <a class="button button-primary" href="{{ url_for('index') }}">Volver al inicio</a>
  </section>
{% endblock %}
