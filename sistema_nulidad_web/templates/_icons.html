{% macro icon(name, class_name='ui-icon') -%}
  <svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name in ['dashboard', 'home'] %}
      <path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-7h6v7"></path>
    {% elif name in ['cases', 'folder'] %}
      <path d="M3 6.5h7l2 2h9v10.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path><path d="M3 10h18"></path>
    {% elif name == 'queue' %}
      <path d="M4 4h16v13H4z"></path><path d="M4 13h5l2 3h2l2-3h5"></path><path d="M8 8h8"></path>
    {% elif name in ['documents', 'versions'] %}
      <path d="M6 2h8l4 4v16H6z"></path><path d="M14 2v5h5"></path><path d="M9 13h6M9 17h6"></path>
    {% elif name in ['assignments', 'users'] %}
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
    {% elif name == 'stages' %}
      <circle cx="5" cy="5" r="2"></circle><circle cx="19" cy="19" r="2"></circle><path d="M7 5h5a3 3 0 0 1 3 3v8"></path><path d="m12 13 3 3 3-3"></path>
    {% elif name == 'deadlines' %}
      <rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path><path d="m9 15 2 2 4-4"></path>
    {% elif name == 'decisions' %}
      <circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path>
    {% elif name in ['history', 'events'] %}
      <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path><path d="M4 4v5h5"></path>
    {% elif name in ['access', 'roles', 'shield'] %}
      <path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6Z"></path><path d="m9 12 2 2 4-4"></path>
    {% elif name == 'signatures' %}
      <path d="m4 18 4-1 10-10-3-3L5 14z"></path><path d="M13 6l3 3M4 21h16"></path>
    {% elif name in ['catalogs', 'list'] %}
      <path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle>
    {% elif name in ['configuration', 'settings'] %}
      <circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0 0 15 6.2L14.7 3h-4L10 6.2a8 8 0 0 0-1.5.9l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.5.9l.7 3.2h4l.3-3.2a8 8 0 0 0 1.5-.9l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"></path>
    {% elif name == 'health' %}
      <path d="M3 12h4l2-5 4 10 2-5h6"></path>
    {% elif name in ['profile', 'user'] %}
      <circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>
    {% elif name == 'logout' %}
      <path d="M10 17l5-5-5-5M15 12H3"></path><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
    {% elif name == 'save' %}
      <path d="M5 3h12l2 2v16H5z"></path><path d="M8 3v6h8V3M8 21v-7h8v7"></path>
    {% elif name == 'arrow' %}
      <path d="M5 12h14M13 6l6 6-6 6"></path>
    {% else %}
      <rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect>
    {% endif %}
  </svg>
{%- endmacro %}
