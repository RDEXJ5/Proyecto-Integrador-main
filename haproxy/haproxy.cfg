global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend public_http
    bind *:80
    http-request redirect scheme https code 301

frontend public_https
    bind *:443 ssl crt /certs/server.pem alpn h2,http/1.1
    acl api_path path_beg /api
    use_backend api_back if api_path
    default_backend web_back

backend api_back
    balance roundrobin
    http-request replace-path ^/api/?(.*) /\1
    option httpchk GET /health
    http-check expect status 200
    server api1 api1:8000 check
    server api2 api2:8000 check

backend web_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 web1:9000 check
    server web2 web2:9000 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s

frontend metrics
    bind *:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
