global:
  resolve_timeout: 5m

route:
  receiver: registro-local
  group_by: [alertname, service, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: registro-local
    webhook_configs:
      - url: http://alert-receiver:9094/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, service]
