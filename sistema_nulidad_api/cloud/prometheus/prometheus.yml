global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: gestion-documental
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: api-web
    metrics_path: /metrics
    static_configs:
      - targets: [api:3000]

  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: [web:5000]

  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: [edge.internal:8405]
        labels:
          server: publico

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: [edge.internal:3000]
        labels:
          server: publico

  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  - job_name: cadvisor-privado
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: cadvisor-publico
    static_configs:
      - targets: [edge.internal:8080]

  - job_name: host-privado
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: host-publico
    static_configs:
      - targets: [edge.internal:9100]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:3000/health
          - http://web:5000/health
          - http://minio:9000/minio/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-edge
    metrics_path: /probe
    params:
      module: [http_2xx_self_signed]
    static_configs:
      - targets:
          - https://edge.internal/__proxy_health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

