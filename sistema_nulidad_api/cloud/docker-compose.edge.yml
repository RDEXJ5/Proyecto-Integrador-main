name: gdi-edge

services:
  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Defina GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Defina GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN}
      GF_SERVER_ROOT_URL: https://${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "private.internal:${PRIVATE_SERVER_IP:?Defina PRIVATE_SERVER_IP}"
    ports:
      - "${EDGE_PRIVATE_BIND_ADDRESS:?Defina EDGE_PRIVATE_BIND_ADDRESS}:3000:3000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  haproxy:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      grafana:
        condition: service_started
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "${EDGE_PRIVATE_BIND_ADDRESS:?Defina EDGE_PRIVATE_BIND_ADDRESS}:8405:8405"
    volumes:
      - ${TLS_CERT_FILE:?Defina TLS_CERT_FILE}:/certs/server.pem:ro
    extra_hosts:
      - "private.internal:${PRIVATE_SERVER_IP:?Defina PRIVATE_SERVER_IP}"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=disk
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "${EDGE_PRIVATE_BIND_ADDRESS:?Defina EDGE_PRIVATE_BIND_ADDRESS}:8080:8080"
    networks:
      - edge

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${EDGE_PRIVATE_BIND_ADDRESS:?Defina EDGE_PRIVATE_BIND_ADDRESS}:9100:9100"
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MONITORED_COMPOSE_PROJECT: gdi-edge
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    extra_hosts:
      - "private.internal:${PRIVATE_SERVER_IP:?Defina PRIVATE_SERVER_IP}"
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  grafana_data:
  alloy_data:

networks:
  edge:
