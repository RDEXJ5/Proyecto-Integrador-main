global
    log stdout format raw local0
    maxconn __HAPROXY_GLOBAL_MAXCONN__
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout http-request 10s
    timeout queue 15s
    timeout client 60s
    timeout server 60s

frontend public_http
    bind *:80
    http-request redirect scheme https code 301

frontend public_https
    bind *:443 ssl crt /certs/server.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proteccion de borde por IP. La tabla conserva conexiones simultaneas y
    # solicitudes de los ultimos diez segundos sin almacenar datos personales.
    stick-table type ip size 200k expire 10m store conn_cur,http_req_rate(10s)

    acl proxy_health path -i /__proxy_health
    acl mobile_api_path path -i /mobile-api
    acl mobile_api_path path_beg -i /mobile-api/
    acl web_api_path path_beg /api
    acl grafana_path path_beg /grafana
    acl mobile_api_metrics path -i /mobile-api/metrics
    acl api_metrics path -i /api/metrics
    acl grafana_metrics path -i /grafana/metrics
    acl excessive_request_rate sc_http_req_rate(0) gt __HAPROXY_REQUESTS_PER_10S__
    acl excessive_grafana_rate sc_http_req_rate(0) gt __HAPROXY_GRAFANA_REQUESTS_PER_10S__
    acl excessive_connections sc_conn_cur(0) gt __HAPROXY_CONNECTIONS_PER_IP__

    http-request return status 200 content-type text/plain string "ok\n" if proxy_health
    http-request track-sc0 src unless proxy_health
    http-request deny deny_status 429 if excessive_request_rate !grafana_path !proxy_health
    http-request deny deny_status 429 if excessive_grafana_rate grafana_path !proxy_health
    http-request deny deny_status 429 if excessive_connections !proxy_health
    http-request deny deny_status 404 if mobile_api_metrics
    http-request deny deny_status 404 if api_metrics
    http-request deny deny_status 404 if grafana_metrics
    use_backend mobile_api_backend if mobile_api_path
    use_backend web_api_backend if web_api_path
    use_backend grafana_backend if grafana_path
    default_backend web_backend

backend mobile_api_backend
    http-request replace-path ^/mobile-api/?(.*) /\1
    option httpchk GET /health
    http-check expect status 200
    server mobile-api private.internal:3001 check inter 5s fall 3 rise 2 maxconn __HAPROXY_MOBILE_API_MAXCONN__ maxqueue __HAPROXY_BACKEND_MAXQUEUE__

backend web_api_backend
    http-request replace-path ^/api/?(.*) /\1
    option httpchk GET /health
    http-check expect status 200
    server api private.internal:3000 check inter 5s fall 3 rise 2 maxconn __HAPROXY_WEB_API_MAXCONN__ maxqueue __HAPROXY_BACKEND_MAXQUEUE__

backend web_backend
    option httpchk GET /health
    http-check expect status 200
    server web private.internal:5000 check inter 5s fall 3 rise 2 maxconn __HAPROXY_WEB_MAXCONN__ maxqueue __HAPROXY_BACKEND_MAXQUEUE__

backend grafana_backend
    option httpchk GET /api/health
    http-check expect status 200
    server grafana grafana:3000 check inter 5s fall 3 rise 2 maxconn __HAPROXY_GRAFANA_MAXCONN__ maxqueue __HAPROXY_BACKEND_MAXQUEUE__

frontend prometheus_metrics
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
