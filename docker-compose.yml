services:
  mysql:
    image: mysql:8.0
    container_name: API_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gestion_documental
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_pass
    ports:
      - "3308:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - legal_net

  api_v4:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: api_v4
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "8004:8000"
    command: uvicorn main_v4:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./API:/app
    networks:
      - legal_net


  api2_v4:
    build:
      context: ./API2
      dockerfile: Dockerfile
    container_name: api2_v4
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "8006:8000"
    command: uvicorn main_v4:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./API2:/app
    networks:
      - legal_net


  flask_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flask_api_documental
    restart: always
    env_file:
      - .env
    depends_on:
      - api_v4
    ports:
      - "9000:9000"
    volumes:
      - ./frontend:/app
    networks:
      - legal_net

  laravel_app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestion_documental
      DB_USERNAME: gestion_user
      DB_PASSWORD: gestion_pass
    depends_on:
      - mysql
    ports:
      - "8005:8000"
    networks:
      - legal_net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    restart: always
    depends_on:
      - api_v4
      - flask_app
      - laravel_app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - legal_net

volumes:
  mysql_data:

networks:
  legal_net: